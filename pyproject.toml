[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layerblame"
version = "0.1.0"
description = "Find out which Dockerfile instruction is busting your build cache."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["docker", "buildkit", "cache", "ci", "performance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
layerblame = "layerblame.cli:main"

[project.urls]
Homepage = "https://github.com/jaydonchua8/layerblame"
Issues = "https://github.com/jaydonchua8/layerblame/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
